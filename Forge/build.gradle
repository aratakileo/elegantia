plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.accesstransformers' version '5.0.3'
    id 'net.minecraftforge.gradle' version '7.0.0-beta.46'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    maven { url "https://repo.spongepowered.org/maven" }

    mavenCentral()
    mavenLocal()
}

base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    accessTransformers = '../../../../Common/build/elegantia-gradle/generated/resources/META-INF/accesstransformer.cfg'

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')

            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            args "-mixin.config=${mod_id}.mixins.json"
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            systemProperty 'mixin.config', 'elegantia.mixins.json'

            // Отключаем строгую валидацию маппингов (чтобы не было "Unable to locate mapping")
            systemProperty 'mixin.env.disableRefMap', 'true'
            systemProperty 'mixin.env.remapRefMap', 'false'
        }

        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('gameTestServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args(
                    '--mod',
                    mod_id,
                    '--all',
                    '--output',
                    layout.projectDirectory.dir('src/generated/resources'),
                    '--existing',
                    layout.projectDirectory.dir('src/main/resources')
            )
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.10'

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
//    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

//jar {
//    manifest {
//        attributes([
//                "MixinConfigs" : "${mod_id}.mixins.json" // mixin
//        ])
//    }
//}

compileJava {
    options.encoding = 'UTF-8'

//    // Привязываем генерацию refmap к аргументам Mixin AP для официальных маппингов
//    options.compilerArgs.addAll([
//            "-AoutRefMapFile=${project.buildDir}/resources/main/${mod_id}.refmap.json",
//            "-AdefaultObfuscationEnv=named" // Для official маппингов в FG7 среда называется named
//    ])
}

tasks.withType(JavaCompile).configureEach {
    // Ждём, пока ForgeGradle сгенерирует или скачает маппинги
    dependsOn tasks.matching { it.name.contains("extractMappings") || it.name.contains("createMapping") }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_name,
                "Specification-Vendor"    : "Arataki Leo",
                "Specification-Version"   : "1",
                "Implementation-Title"    : mod_name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "Arataki Leo",
                "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }
}
